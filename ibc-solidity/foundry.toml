# Full reference https://github.com/foundry-rs/foundry/tree/master/crates/config

[profile.default]
  auto_detect_solc = false
  block_timestamp = 1_680_220_800 # March 31, 2023 at 00:00 GMT
  bytecode_hash = "none"
  # The contracts depend on EIP-1153 transient storage (ReentrancyGuardTransient, light client proof
  # caches), so deployments require Cancun. Do not lower this to target an older chain.
  evm_version = "cancun"
  fuzz = { runs = 5_000 }
  # The Besu simulator benchmarks populate thousands of storage slots per case, exceeding the 2^30 default.
  gas_limit = 9_223_372_036_854_775_807
  gas_reports = ["*"]
  gas_snapshot_emit = false
  isolate = false
  optimizer = true
  via_ir = true # This is needed because of the `sp1-ics07-tendermint` contract
  optimizer_runs = 10_000
  out = "out"
  script = "scripts"
  snapshots = "benchmarks/snapshots"
  solc = "0.8.37"
  src = "contracts"
  test = "test"
  fs_permissions = [{ access = "read-write", path = "./" },]

[fmt]
  bracket_spacing = true
  ignore = ["contracts/light-clients/utils/TrieProof.sol"]
  int_types = "long"
  line_length = 120
  multiline_func_header = "all"
  number_underscore = "thousands"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true

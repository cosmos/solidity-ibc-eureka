[package]
name       = "ibc-eureka-utils"
version    = { workspace = true }
edition    = { workspace = true }
repository = { workspace = true }
license    = { workspace = true }

[dependencies]
anyhow                           = { workspace = true, features = ["std"] }
async-trait                      = { workspace = true }
prost                            = { workspace = true }
ibc-proto                        = { workspace = true }
ibc-proto-eureka                 = { workspace = true }
cosmos-sdk-proto                 = { workspace = true }
ibc-client-tendermint-types      = { workspace = true }
ibc-eureka-solidity-types        = { workspace = true }
ibc-core-commitment-types        = { workspace = true }
ibc-core-client-types            = { workspace = true }
ibc-core-host-types              = { workspace = true, features = ["std"] }
tendermint-light-client-verifier = { workspace = true }
tendermint-rpc                   = { workspace = true, features = ["http-client"] }
tendermint                       = { workspace = true }
# We need to use 0.11 until tendermint-rpc is updated to use 0.12
reqwest_0_11                     = { workspace = true, features = ["rustls-tls-manual-roots"] }
# rustls 0.23 only verifies certificates here; the handshake runs on rustls 0.21
rustls                           = { workspace = true, features = ["ring", "std"] }
rustls_0_21                      = { workspace = true, features = ["dangerous_configuration", "tls12"] }
rustls-native-certs              = { workspace = true }
rustls-webpki                    = { workspace = true, features = ["std"] }
webpki-roots                     = { workspace = true }
tracing                          = { workspace = true }

[dev-dependencies]
rcgen                            = { workspace = true, features = ["ring"] }
# The TLS 1.2 handshake tests run a rustls 0.23 server
rustls                           = { workspace = true, features = ["tls12"] }

[package]
name = "ethereum-light-client"
version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }

[features]
test-utils = ["dep:milagro_bls", "dep:ibc-proto-eureka", "dep:prost", "dep:ibc-eureka-solidity-types"]

[[bin]]
name = "generate_json_schema"
path = "src/bin/generate_json_schema.rs"

[dependencies]
ethereum-trie-db = { workspace = true }
ethereum-types = { workspace = true }

alloy-primitives = { workspace = true, features = ["serde", "hex-compat", "rlp"] }
alloy-rlp = { workspace = true, features = ["arrayvec"] }
tree_hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
schemars = { workspace = true }
hex = { workspace = true }

# Only used for test-utils feature
milagro_bls = { workspace = true, optional = true }
ibc-proto-eureka = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
ibc-eureka-solidity-types = { workspace = true, optional = true }

[dev-dependencies]
# The `#[cfg(test)]` modules (and the `test_utils` module, active under `cfg(test)`) use
# these crates directly, so they must be available when building this crate's own tests.
# They are also exposed to external consumers as optional deps via the `test-utils` feature
# above. Previously the tests only compiled because the cw-ics08-wasm-eth consumer enabled
# `test-utils` workspace-wide; that contract is now a separate workspace, so the crate has
# to pull these in for its own tests.
milagro_bls = { workspace = true }
ibc-proto-eureka = { workspace = true }
prost = { workspace = true }
ibc-eureka-solidity-types = { workspace = true }

# SPDX-License-Identifier: Apache-2.0

name: e2e-setup
description: Sets up the E2E test environment

inputs:
  github_token:
    description: A Github PAT
    required: true

runs:
  using: composite
  steps:
    - name: Login to GHCR
      uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
      env:
          GH_TOKEN: ${{ inputs.github_token }}
      with:
        timeout_minutes: 1
        max_attempts: 5
        retry_wait_seconds: 5
        command: docker login ghcr.io -u ${{ github.actor }} --password-stdin <<< "$GH_TOKEN"

    - name: Pre-pull private images
      uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 5
        command: docker pull ghcr.io/cosmos/wfchain:latest
      continue-on-error: true

    - name: Set up foundry tooling
      uses: ./.github/actions/foundry-setup

    # Same setup-go version as the e2e lint job: its cache key embeds a version-specific
    # format, so mismatched versions store the same e2e module cache twice (~1.6 GB each).
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.26.5
        check-latest: true
        cache-dependency-path: e2e/interchaintestv8/go.sum

    - name: Download build artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: e2e-build-artifacts
        path: e2e-artifacts/

    - name: Install just
      uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0

    - name: Install artifacts
      shell: bash
      run: |
        # Install binaries
        chmod +x e2e-artifacts/bin/*
        mkdir -p ~/.cargo/bin
        cp e2e-artifacts/bin/* ~/.cargo/bin/
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

        # Install SP1 programs
        mkdir -p ibc-solidity/programs/sp1-programs/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/
        cp -r e2e-artifacts/sp1-programs/* ibc-solidity/programs/sp1-programs/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/

        # Install Solana programs
        mkdir -p ibc-solana/target/deploy/
        cp -r e2e-artifacts/solana-programs/* ibc-solana/target/deploy/

    # Must match the kurtosis library version we use in the e2e tests.
    # The apt.fury.io repo stopped receiving releases after 1.15.2, so install
    # the versioned .deb from the kurtosis-cli-release-artifacts releases.
    - name: Install Kurtosis
      if: contains(fromJSON('["pos", "optimism", "arbitrum", "cosmos"]'), env.ETH_TESTNET_TYPE)
      uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 5
        command: |
          curl -fsSL -o /tmp/kurtosis-cli.deb https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/1.20.0/kurtosis-cli_1.20.0_linux_amd64.deb
          sudo apt install -y /tmp/kurtosis-cli.deb

    - name: Start Kurtosis
      if: contains(fromJSON('["pos", "optimism", "arbitrum", "cosmos"]'), env.ETH_TESTNET_TYPE)
      shell: bash
      run: |
        kurtosis engine start
        kurtosis analytics disable
        echo "$(dirname $(which kurtosis))" >> $GITHUB_PATH

    # setup-all caches the Solana toolchain itself (keyed on the version), so no separate
    # cache step is needed; the built programs come from e2e-build-artifacts.
    - name: Setup Solana
      uses: solana-developers/github-actions/setup-all@860d4e7d3afc9f180f3c5016593a1e86e77eede4 # v0.2.5
      with:
        solana_version: ${{ env.SOLANA_VERSION }}

    - name: Pull attestor Docker image
      uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 5
        command: docker pull ${IBC_ATTESTOR_IMAGE:-ghcr.io/cosmos/ibc-attestor:v0.3.0}

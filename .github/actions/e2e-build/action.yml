# SPDX-License-Identifier: Apache-2.0

name: e2e-build
description: Builds and caches the SP1, proof-api, operator and Solana artifacts the E2E suites consume

inputs:
  github_token:
    description: A Github PAT
    required: true

runs:
  using: composite
  steps:
    - name: Set up foundry tooling
      uses: ./.github/actions/foundry-setup

    - name: Cache SP1 Toolchain
      id: cache-sp1-toolchain
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.sp1
          ~/.rustup/toolchains/succinct
        key: ${{ runner.os }}-sp1-toolchain-${{ env.SP1_VERSION }}

    - name: Install SP1 toolchain
      if: steps.cache-sp1-toolchain.outputs.cache-hit != 'true'
      uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 5
        command: |
          curl -L https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up --version ${{ env.SP1_VERSION }} --token ${{ inputs.github_token }}

    - name: Cache SP1 Programs
      id: cache-sp1-programs
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ibc-solidity/programs/sp1-programs/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/*
        key: ${{ runner.os }}-sp1-programs-${{ hashFiles('ibc-solidity/programs/sp1-programs/**', 'Cargo.lock') }}

    - name: Install just
      if: steps.cache-sp1-programs.outputs.cache-hit != 'true'
      uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0

    - name: Build SP1 Programs
      if: steps.cache-sp1-programs.outputs.cache-hit != 'true'
      shell: bash
      run: just solidity::build-sp1-programs

    - name: Cache Proof API
      id: cache-proof-api
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cargo/bin/proof-api
        key: ${{ runner.os }}-proof-api-${{ hashFiles('programs/proof-api/**', 'packages/**', 'ibc-solana/packages/solana-ibc-constants/**', 'ibc-solana/packages/solana-ibc-types/**', 'ibc-solidity/abi/bytecode/**', 'Cargo.lock') }}

    - name: Cache Operator
      id: cache-operator
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cargo/bin/operator
        key: ${{ runner.os }}-operator-${{ hashFiles('ibc-solidity/programs/operator/**', 'packages/**', 'Cargo.lock') }}

    - name: Cache Rust build state
      if: steps.cache-proof-api.outputs.cache-hit != 'true' || steps.cache-operator.outputs.cache-hit != 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: e2e-build
        cache-on-failure: true
        cache-bin: false
        # ~2 GB per entry: only main writes it (PRs can read main's caches), so PR
        # branches don't churn the repo's cache quota and evict each other.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install proof API
      if: steps.cache-proof-api.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cargo install --bin proof-api --path programs/proof-api --locked \
          --target-dir "${{ github.workspace }}/target"

    - name: Install operator
      if: steps.cache-operator.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cargo install --bin operator --path ibc-solidity/programs/operator --locked \
          --target-dir "${{ github.workspace }}/target"

    # Restore-only here; saved below on main alone, for the same quota reason as the Rust
    # build state above. Keep `path` in sync with the save step. Build outputs only: the
    # Solana and Anchor toolchains are cached by setup-all, and only needed on a miss.
    - name: Restore Solana Programs
      id: cache-solana
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ./ibc-solana/target/deploy/
          ./ibc-solana/target/sbpf-solana-solana/
        key: ${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-${{ env.ANCHOR_VERSION }}-${{ hashFiles('ibc-solana/programs/**', 'ibc-solana/packages/**', 'ibc-solana/Cargo.lock', 'ibc-solana/Cargo.toml', 'ibc-solana/Anchor.toml', 'ibc-solana/rust-toolchain.toml', 'ibc-solana/solana.just', 'packages/tendermint-light-client/**', 'packages/constrained_types/**', 'proto/**', 'ibc-solidity/abi/IFTOwnable.json', 'ibc-solidity/contracts/light-clients/attestation/msgs/**', 'ibc-solidity/contracts/msgs/**', 'scripts/build-solana-test-instance.sh', 'solana-keypairs/localnet/**', 'justfile') }}
        restore-keys: |
          ${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-${{ env.ANCHOR_VERSION }}-

    - name: Setup Solana and Anchor
      if: steps.cache-solana.outputs.cache-hit != 'true'
      uses: solana-developers/github-actions/setup-all@860d4e7d3afc9f180f3c5016593a1e86e77eede4 # v0.2.5
      with:
        anchor_version: ${{ env.ANCHOR_VERSION }}
        solana_version: ${{ env.SOLANA_VERSION }}

    - name: Install just for Solana build
      if: steps.cache-solana.outputs.cache-hit != 'true'
      uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0

    # A restore-keys fallback brings back an older target/deploy; clear it so programs
    # that were since removed or renamed don't end up in the packaged artifacts. This
    # matches a cold build: program IDs come from declare_id!, and E2E deploys with the
    # tracked solana-keypairs/localnet/, so the keypairs Anchor regenerates here are unused.
    - name: Build Solana Programs
      if: steps.cache-solana.outputs.cache-hit != 'true'
      shell: bash
      run: |
        rm -rf ibc-solana/target/deploy
        just solana::build-solana-programs

    - name: Save Solana Programs
      if: github.ref == 'refs/heads/main' && steps.cache-solana.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ./ibc-solana/target/deploy/
          ./ibc-solana/target/sbpf-solana-solana/
        key: ${{ steps.cache-solana.outputs.cache-primary-key }}

    - name: Package artifacts
      shell: bash
      run: |
        mkdir -p e2e-artifacts/bin
        mkdir -p e2e-artifacts/sp1-programs
        mkdir -p e2e-artifacts/solana-programs
        cp ~/.cargo/bin/proof-api e2e-artifacts/bin/
        cp ~/.cargo/bin/operator e2e-artifacts/bin/
        cp -r ibc-solidity/programs/sp1-programs/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/* e2e-artifacts/sp1-programs/
        cp -r ibc-solana/target/deploy/* e2e-artifacts/solana-programs/

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: e2e-build-artifacts
        path: e2e-artifacts/
        retention-days: 1

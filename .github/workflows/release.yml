# SPDX-License-Identifier: Apache-2.0

name: release

on:
  release:
    types: [published]

permissions: {}

env:
  SP1_VERSION: "6.1.0"


jobs:
  release-sp1-programs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref_name, 'sp1-programs-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.0
      - name: Install SP1 toolchain
        shell: bash
        run: |
          curl -L https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up --version ${{ env.SP1_VERSION }} --token ${{ secrets.GITHUB_TOKEN }}
          ~/.sp1/bin/cargo-prove prove --version
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build SP1 Programs
        shell: bash
        run: just solidity::build-sp1-programs

      - name: Upload SP1 programs to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: ibc-solidity/programs/sp1-programs/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/sp1-ics07-tendermint-{update-client,membership,uc-and-membership,misbehaviour}
          tag: ${{ github.ref }}
          overwrite: true

  release-cw-ics08-wasm-eth:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref_name, 'cw-ics08-wasm-eth-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload cw-ics08-wasm-eth to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: e2e/interchaintestv8/wasm/cw_ics08_wasm_eth.wasm.gz
          tag: ${{ github.ref }}
          overwrite: true

  release-solidity-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref_name, 'solidity-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build and package the contracts
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: ./ibc-solidity/scripts/package-contracts.sh

      - name: Upload solidity contract artifacts to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ibc-solidity/solidity-contracts-${{ github.ref_name }}.tar.gz
          tag: ${{ github.ref }}
          overwrite: true

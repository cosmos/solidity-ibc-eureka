# SPDX-License-Identifier: Apache-2.0

name: abigen

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ibc-solidity/abi/**'
      - 'ibc-solidity/solidity.just'
      - 'packages/go-abigen/**'
      - 'e2e/interchaintestv8/types/**'
      - 'e2e/interchaintestv8/go.mod'
      - 'e2e/interchaintestv8/go.sum'
      - '.github/workflows/abigen.yaml'
      - '**.sol'
      - 'ibc-solidity/bun.lock'
  push:
    branches:
      - main
    paths:
      - 'ibc-solidity/abi/**'
      - 'ibc-solidity/solidity.just'
      - 'packages/go-abigen/**'
      - 'e2e/interchaintestv8/types/**'
      - 'e2e/interchaintestv8/go.mod'
      - 'e2e/interchaintestv8/go.sum'
      - '.github/workflows/abigen.yaml'
      - '**.sol'
      - 'ibc-solidity/bun.lock'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/foundry-setup

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install abigen
        run: go install github.com/ethereum/go-ethereum/cmd/abigen@9621c6ad10934a01b5514886fb6fbd87640b6c05 # v1.17.5

      - name: Generate contract artifacts
        run: just solidity::generate-abi

      - name: Check generated contract artifacts
        run: |
          if [ -n "$(git status --short --untracked-files=all -- ibc-solidity/abi packages/go-abigen e2e/interchaintestv8/types/erc20)" ]; then
            echo "Generated contract artifacts are stale."
            git status --short --untracked-files=all -- ibc-solidity/abi packages/go-abigen e2e/interchaintestv8/types/erc20
            git diff --stat -- ibc-solidity/abi packages/go-abigen e2e/interchaintestv8/types/erc20
            exit 1
          else
            echo "Generated contract artifacts are current."
          fi

  golangci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: packages/go-abigen/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          working-directory: packages/go-abigen

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: packages/go-abigen/go.sum

      - name: Unit test abigen
        run: cd packages/go-abigen && go test -v ./...

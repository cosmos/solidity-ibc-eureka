# SPDX-License-Identifier: Apache-2.0

name: solana

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/tendermint-light-client/**'
      - 'packages/constrained_types/**'
      - 'packages/proof-api/**'
      - 'ibc-solana/**'
      - 'ibc-solidity/abi/IFTOwnable.json'
      - 'ibc-solidity/contracts/light-clients/attestation/msgs/**'
      - 'ibc-solidity/contracts/msgs/**'
      - 'programs/proof-api/**'
      - 'proto/**'
      - 'scripts/build-solana-test-instance.sh'
      - 'solana-keypairs/localnet/**'
      - '.github/workflows/solana.yml'
      - 'justfile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "2.3.13"
  ANCHOR_VERSION: "0.32.1"

jobs:
  build-and-test:
    name: build-and-test-solana
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # nightly is the default toolchain used to build and run the tests. The trybuild UI
      # snapshots in solana-ibc-macros track nightly's diagnostic rendering, so build/test
      # must stay on nightly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.89.0
        with:
          components: rustfmt, clippy

      # Linting is pinned separately to the Rust version our Anchor requires (Anchor 0.32 ->
      # rustc >= 1.89.0): `just lint-solana` runs fmt/clippy via `cargo +1.89.0`. A floating
      # nightly regularly broke linting whenever a new clippy lint landed upstream; pinning
      # keeps lints deterministic and matched to the toolchain Anchor targets.
      - name: Install Rust 1.89.0 for Solana linting
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup component add --toolchain 1.89.0 clippy rustfmt

      # Restore-only here; saved at the end of the job on main alone, so PR branches don't
      # churn the repo's cache quota (PRs can read main's caches). Keep `path` in sync with
      # the save step.
      - name: Restore Rust dependencies
        id: cache-rust
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ibc-solana/target/
          key: ${{ runner.os }}-cargo-solana-rust-1.89.0-${{ hashFiles('ibc-solana/Cargo.lock') }}-anchor-${{ env.ANCHOR_VERSION }}
          restore-keys: |
            ${{ runner.os }}-cargo-solana-

      - uses: solana-developers/github-actions/setup-all@e6ed2eb93c55eca911dbc711fb08683b42926a28 # v0.2.15
        with:
          anchor_version: ${{ env.ANCHOR_VERSION }}
          solana_version: ${{ env.SOLANA_VERSION }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Sync Solana localnet keys
        run: just solana::sync-solana-keys localnet

      - name: Build Solana programs
        run: just solana::build-solana-programs

      - name: Build Solana test programs
        run: just solana::build-solana-test-programs

      - name: Run Solana linting
        run: just solana::lint-solana

      - name: Run Solana integration tests
        run: just solana::test-solana-integration
        env:
          RUST_BACKTRACE: 1

      - name: Run Solana unit tests
        run: just solana::test-solana
        env:
          RUST_BACKTRACE: 1

      - name: Save Rust dependencies
        if: github.ref == 'refs/heads/main' && steps.cache-rust.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ibc-solana/target/
          key: ${{ steps.cache-rust.outputs.cache-primary-key }}

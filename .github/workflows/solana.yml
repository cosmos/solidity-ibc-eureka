name: solana

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/tendermint-light-client/**'
      - 'packages/proof-api/**'
      - 'programs/solana/**'
      - 'programs/proof-api/**'
      - '.github/workflows/solana.yml'
      - 'justfile'
      - 'ibc-solidity/solidity.just'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "2.3.13"
  ANCHOR_VERSION: "0.32.1"

jobs:
  build-and-test:
    name: build-and-test-solana
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # nightly is the default toolchain used to build and run the tests. The trybuild UI
      # snapshots in solana-ibc-macros track nightly's diagnostic rendering, so build/test
      # must stay on nightly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      # Linting is pinned separately to the Rust version our Anchor requires (Anchor 0.32 ->
      # rustc >= 1.89.0): `just lint-solana` runs fmt/clippy via `cargo +1.89.0`. A floating
      # nightly regularly broke linting whenever a new clippy lint landed upstream; pinning
      # keeps lints deterministic and matched to the toolchain Anchor targets.
      - name: Install Rust 1.89.0 for Solana linting
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup component add --toolchain 1.89.0 clippy rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-solana-${{ hashFiles('**/Cargo.lock') }}-anchor-${{ env.ANCHOR_VERSION }}
          restore-keys: |
            ${{ runner.os }}-cargo-solana-

      - uses: solana-developers/github-actions/setup-all@v0.2.5
        with:
          anchor_version: ${{ env.ANCHOR_VERSION }}
          solana_version: ${{ env.SOLANA_VERSION }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Sync Solana localnet keys
        run: just sync-solana-keys localnet

      - name: Build Solana programs
        run: just build-solana-programs

      - name: Build Solana test programs
        run: just build-solana-test-programs

      - name: Run Solana linting
        run: just lint-solana

      - name: Run Solana integration tests
        run: just test-solana-integration
        env:
          RUST_BACKTRACE: 1

      - name: Run Solana unit tests
        run: just test-solana
        env:
          RUST_BACKTRACE: 1

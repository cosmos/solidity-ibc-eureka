# SPDX-License-Identifier: Apache-2.0

name: e2e
on:
  workflow_dispatch:
    inputs:
      ibc-go-docker-tag:
        description: 'ibc-go Docker image tag'
        type: string
        required: false
        default: 'v11.0.0'
      wasm-light-client-tag:
        description: 'Wasm light client release tag'
        type: choice
        required: true
        default: 'local'
        options:
          - local
  pull_request:
    # Union of the three original filters.
    paths:
      - 'justfile'
      - 'ibc-solidity/solidity.just'
      - '**.rs'
      - '**.go'
      - '**.toml'
      - '**.lock'
      - '**.mod'
      - '**.sum'
      - '**.sol'
      - '.github/workflows/e2e.yml'
      - '.github/actions/**'
      - 'ibc-solidity/bun.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci
  SP1_VERSION: "6.1.0"
  SOLANA_VERSION: "2.3.13"
  ANCHOR_VERSION: "0.32.1"
  E2E_IBC_GO_DOCKER_TAG: ${{ inputs.ibc-go-docker-tag || 'v11.0.0' }}
  IBC_ATTESTOR_IMAGE: ghcr.io/cosmos/ibc-attestor:v0.3.0
  # Attestor defaults; jobs override what differs.
  ETH_TESTNET_TYPE: anvil
  E2E_WASM_LIGHT_CLIENT_TAG: ""
  COSMOS_LC_ON_ETH: attestor

permissions: {}

jobs:
  # Built once, consumed by every test job below via the e2e-build-artifacts artifact.
  build-e2e-programs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build E2E artifacts
        uses: ./.github/actions/e2e-build
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  golangci:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: e2e/interchaintestv8/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          working-directory: e2e/interchaintestv8

  generate-matrix-mock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.get-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate Test Matrix
        id: get-matrix
        uses: ./.github/actions/e2e-matrix
        with:
          skip-tests: TestWithProofAPITestSuite/Test_2_ConcurrentRecvPacketToEth,TestWithProofAPITestSuite/Test_MultiPeriodClientUpdateToCosmos,TestWithProofAPITestSuite/Test_5_FinalizedTimeoutPacketFromEth,TestWithProofAPITestSuite/Test_UpdateClientToCosmos,TestWithEthToEthAttestedTestSuite,TestWithMultiAttestorTestSuite

  generate-matrix-attestor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.get-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate Test Matrix
        id: get-matrix
        env:
          TEST_ENTRYPOINT: TestWithIbcEurekaTestSuite
        uses: ./.github/actions/e2e-matrix

  generate-matrix-eth-to-eth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.get-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate Test Matrix
        id: get-matrix
        env:
          TEST_ENTRYPOINT: TestWithEthToEthAttestedTestSuite
        uses: ./.github/actions/e2e-matrix

  generate-matrix-besu-to-besu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.get-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate Test Matrix
        id: get-matrix
        env:
          TEST_ENTRYPOINT: TestWithBesuToBesuTestSuite
        uses: ./.github/actions/e2e-matrix

  # ------------------------------------------------------------ mock (was e2e-mock)
  e2e-mock:
    needs: [generate-matrix-mock, build-e2e-programs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix-mock.outputs.matrix) }}
    name: mock/${{ matrix.entrypoint }}/${{ matrix.test }}
    env:
      ETH_LC_ON_COSMOS: dummy
      COSMOS_LC_ON_ETH: sp1
      SP1_PROVER: mock
      E2E_PROOF_TYPE: groth16

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up E2E environment
        uses: ./.github/actions/e2e-setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        env:
          NETWORK_PRIVATE_KEY: ${{ secrets.SP1_PRIVATE_KEY }}
        run: |
          cd e2e/interchaintestv8
          go test -v -mod=readonly . -run "^${{ matrix.entrypoint }}$/${{ matrix.test }}$" -timeout 40m

  # ------------------------------------------------------ attestor (was e2e-attestor)
  e2e-attestor-native:
    needs: [generate-matrix-attestor, build-e2e-programs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix-attestor.outputs.matrix) }}
    name: attestor-native/${{ matrix.entrypoint }}/${{ matrix.test }}
    env:
      ETH_LC_ON_COSMOS: attestor-native

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up E2E environment
        uses: ./.github/actions/e2e-setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        env:
          NETWORK_PRIVATE_KEY: ${{ secrets.SP1_PRIVATE_KEY }}
          ETH_TESTNET_TYPE: ${{ env.ETH_TESTNET_TYPE }}
        run: |
          cd e2e/interchaintestv8
          go test -v -mod=readonly . -run "^${{ matrix.entrypoint }}$/${{ matrix.test }}$" -timeout 60m

  e2e-eth-to-eth-attestor:
    needs: [generate-matrix-eth-to-eth, build-e2e-programs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix-eth-to-eth.outputs.matrix) }}
    name: attestor-native/${{ matrix.entrypoint }}/${{ matrix.test }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up E2E environment
        uses: ./.github/actions/e2e-setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        run: |
          cd e2e/interchaintestv8
          go test -v -mod=readonly . -run "^${{ matrix.entrypoint }}$/${{ matrix.test }}$" -timeout 60m

  e2e-besu-qbft:
    needs: build-e2e-programs
    name: besu-qbft/ics20-roundtrip
    env:
      ETH_TESTNET_TYPE: besu-qbft
      ETH_LC_ON_COSMOS: attestor-native
      COSMOS_LC_ON_ETH: sp1
      SP1_PROVER: mock
      E2E_PROOF_TYPE: groth16
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up E2E environment
        uses: ./.github/actions/e2e-setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run test
        run: |
          cd e2e/interchaintestv8
          go test -v -mod=readonly . -run '^TestWithIbcEurekaTestSuite$/^Test_ICS20TransferERC20TokenfromEthereumToCosmosAndBack$' -timeout 60m

  e2e-besu-to-besu:
    needs: [generate-matrix-besu-to-besu, build-e2e-programs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix-besu-to-besu.outputs.matrix) }}
    name: besu-to-besu/${{ matrix.test }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up E2E environment
        uses: ./.github/actions/e2e-setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Go package tests
        run: |
          cd e2e/interchaintestv8
          go test ./e2esuite
      - name: Run Besu to Besu test
        run: |
          cd e2e/interchaintestv8
          go test -v -mod=readonly . -run "^${{ matrix.entrypoint }}$/${{ matrix.test }}$" -timeout 60m

  e2e-multi-attestor-native:
    needs: build-e2e-programs
    strategy:
      fail-fast: false
      matrix:
        include:
          - total_signers: 3
            required_signatures: 2
            active_attestors: 2
          - total_signers: 10
            required_signatures: 7
            active_attestors: 7
    name: multi-attestor-native/${{ matrix.active_attestors }}-of-${{ matrix.total_signers }}
    env:
      ETH_LC_ON_COSMOS: attestor-native
      MULTI_ATTESTOR_COUNT: ${{ matrix.total_signers }}
      MULTI_ATTESTOR_QUORUM: ${{ matrix.required_signatures }}
      MULTI_ATTESTOR_ACTIVE: ${{ matrix.active_attestors }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up E2E environment
        uses: ./.github/actions/e2e-setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        run: |
          cd e2e/interchaintestv8
          go test -v -mod=readonly . -run "^TestWithMultiAttestorTestSuite$/Test_MultiAttestorTransferWithAggregation$" -timeout 60m

  e2e-update-client-cosmos-to-eth:
    needs: build-e2e-programs
    name: update-client-cosmos-to-eth
    env:
      ETH_LC_ON_COSMOS: attestor-native
      MULTI_ATTESTOR_COUNT: 1
      MULTI_ATTESTOR_QUORUM: 1
      MULTI_ATTESTOR_ACTIVE: 1

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up E2E environment
        uses: ./.github/actions/e2e-setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        run: |
          cd e2e/interchaintestv8
          go test -v -mod=readonly . -run "^TestWithMultiAttestorTestSuite$/Test_UpdateClientCosmosToEth$" -timeout 60m

  # ------------------------------ light-client combos (was e2e-lc-combinations)
  e2e-lc-combinations:
    needs: build-e2e-programs
    strategy:
      fail-fast: false
      matrix:
        test:
          - Test_TimeoutPacketFromCosmos
          - Test_TimeoutPacketFromEth
          - Test_ICS20TransferERC20TokenfromEthereumToCosmosAndBack
        eth_lc_on_cosmos:
          - dummy
          - attestor-native
        cosmos_lc_on_eth:
          - sp1
          - attestor
    name: ${{ matrix.test }}/eth=${{ matrix.eth_lc_on_cosmos }}/cosmos=${{ matrix.cosmos_lc_on_eth }}
    env:
      E2E_WASM_LIGHT_CLIENT_TAG: ${{ inputs.wasm-light-client-tag || 'local' }}
      SP1_PROVER: mock
      E2E_PROOF_TYPE: groth16
      ETH_LC_ON_COSMOS: ${{ matrix.eth_lc_on_cosmos }}
      COSMOS_LC_ON_ETH: ${{ matrix.cosmos_lc_on_eth }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up E2E environment
        uses: ./.github/actions/e2e-setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        env:
          NETWORK_PRIVATE_KEY: ${{ secrets.SP1_PRIVATE_KEY }}
        run: |
          cd e2e/interchaintestv8
          go test -v -mod=readonly . -run "^TestWithIbcEurekaTestSuite$/${{ matrix.test }}$" -timeout 60m

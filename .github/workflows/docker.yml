# SPDX-License-Identifier: Apache-2.0

name: docker

permissions: {}

on:
  workflow_dispatch:
  push:
    tags:
      - proof-api-v[0-9]+.[0-9]+.[0-9]+
  pull_request:
    paths:
      - '**.rs'
      - '**.toml'
      - '**.lock'
      - '**.proto'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - 'ibc-solidity/abi/**'
      - 'ibc-solidity/contracts/**'
      - 'programs/proof-api/Dockerfile'
      - 'scripts/proof_api_docker_entrypoint.sh'

# Cancel the workflow if a new commit is pushed to the branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-proof-api:
    runs-on: depot-ubuntu-24.04-4
    permissions:
      id-token: write
      contents: read
      packages: write
    env:
      registry_url: ghcr.io/cosmos/proof-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ env.registry_url }}
          tags: |
            # Tag triggered events
            type=match,event=tag,pattern=^proof-api-(v[0-9]+\.[0-9]+\.[0-9]+)$,group=1,priority=1000

            # Latest, but only on main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }},priority=900

            # For PR tags
            type=ref,event=pr,priority=800

            # For sha tags
            type=sha,priority=700,prefix=
      - name: Build and push
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ./programs/proof-api/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

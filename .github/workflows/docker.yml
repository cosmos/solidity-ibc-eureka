# SPDX-License-Identifier: Apache-2.0

name: docker

permissions: {}

on:
  workflow_dispatch:
  push:
    tags:
      - proof-api-v[0-9]+.[0-9]+.[0-9]+
  pull_request:
    paths:
      - '**.rs'
      - '**.toml'
      - '**.lock'
      - '**.proto'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - 'ibc-solidity/abi/**'
      - 'ibc-solidity/contracts/**'
      - 'programs/proof-api/Dockerfile'
      - 'scripts/proof_api_docker_entrypoint.sh'

# Cancel the workflow if a new commit is pushed to the branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-proof-api:
    runs-on: depot-ubuntu-24.04-4
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
    env:
      registry_url: ghcr.io/cosmos/proof-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ env.registry_url }}
          tags: |
            # Tag triggered events
            type=match,event=tag,pattern=^proof-api-(v[0-9]+\.[0-9]+\.[0-9]+)$,group=1,priority=1000

            # Latest, but only on main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }},priority=900

            # For PR tags
            type=ref,event=pr,priority=800

            # For sha tags
            type=sha,priority=700,prefix=
      - name: Build and push
        id: push
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ./programs/proof-api/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          # Disable BuildKit's unsigned attestations, so the pushed index only references the
          # platform images.
          provenance: false

      # Images built for pull requests are not signed or attested.
      - name: Resolve platform digests
        id: platforms
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          raw=$(docker buildx imagetools inspect "${registry_url}@${DIGEST}" --raw)
          for arch in amd64 arm64; do
            digest=$(jq -r --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' <<< "$raw")
            echo "${arch}=${digest}" >> "$GITHUB_OUTPUT"
          done
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.registry_url }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Generate SBOM (linux/amd64)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.registry_url }}@${{ steps.platforms.outputs.amd64 }}
          format: spdx-json
          output-file: sbom-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM (linux/amd64)
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.registry_url }}
          subject-digest: ${{ steps.platforms.outputs.amd64 }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
      - name: Generate SBOM (linux/arm64)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.registry_url }}@${{ steps.platforms.outputs.arm64 }}
          format: spdx-json
          output-file: sbom-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM (linux/arm64)
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.registry_url }}
          subject-digest: ${{ steps.platforms.outputs.arm64 }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'
      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        # --recursive also signs the platform manifests referenced by the index.
        run: cosign sign --yes --recursive "${registry_url}@${DIGEST}"

# SPDX-License-Identifier: Apache-2.0

# Based on https://github.com/actions-rs/example/blob/master/.github/workflows/quickstart.yml
name: rust

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**.rs'
      - '**.toml'
      - '**.lock'
      - '**.proto'
      - 'ibc-solidity/abi/**'
      - '.github/workflows/rust.yml'

jobs:
  lints:
    name: fmt-and-clippy
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/foundry-setup

      - name: Run cargo fmt
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1.0.3
        with:
          command: fmt
          args: --all -- --check
      - name: Run cargo clippy
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1.0.3
        with:
          command: clippy

      # cw-ics08-wasm-eth is its own workspace (separate Cargo.lock), so the root
      # fmt/clippy above do not reach it. Lint it explicitly from its directory.
      - name: Run cargo fmt and clippy (cw-ics08-wasm-eth)
        run: |
          cd ibc-solidity/programs/cw-ics08-wasm-eth
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings

  tests:
    name: unit-tests
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/foundry-setup

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Run unit tests
        run: just test-cargo
        env:
          RUST_BACKTRACE: 1

  build-proof-api:
    name: build-proof-api
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/foundry-setup
      - name: Build
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1.0.3
        with:
          command: build
          args: --bin proof-api --release --locked

  build-operator:
    name: build-operator
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/foundry-setup
      - name: Build
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1.0.3
        with:
          command: build
          args: --bin operator --release --locked
